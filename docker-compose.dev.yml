version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stelladullam-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stelladullam_defi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stelladullam_defi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stelladullam-network

  redis:
    image: redis:7-alpine
    container_name: stelladullam-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stelladullam-network

volumes:
  postgres_data:
  redis_data:

networks:
  stelladullam-network:
    driver: bridge
